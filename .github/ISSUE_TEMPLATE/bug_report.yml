name: Report a bug
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting it. Security issues **don't** go here: use the Security tab."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Spotify and play a song
        2. Hover over the island
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zenit version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: Contents of %AppData%\Zenit\error.log, if it exists.
      render: text
