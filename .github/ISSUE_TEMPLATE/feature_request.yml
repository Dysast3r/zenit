name: Suggest an improvement
description: An idea to make the island more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your proposal
      description: How you picture it working. Screenshots or sketches help a lot.
    validations:
      required: true
